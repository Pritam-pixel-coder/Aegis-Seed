name: Aegis-Seed CI & Constant-Time Verification Gate

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Job 1: no_std Verification and Cross-Platform Unit Tests
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        rust: [stable]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Code Formatting Check
        run: cargo fmt -- --check

      - name: Clippy Linter Check
        run: cargo clippy --all-targets -- -D warnings

      - name: Verify strict #![no_std] Core Build
        run: cargo check --no-default-features

      - name: Run Full Pipeline Tests
        run: cargo test --verbose

      - name: Run Pipeline Executable
        run: cargo run --release

  # Job 2: Dudect Statistical Constant-Time Leakage Gate (Welch's t-test)
  dudect-statistical-gate:
    name: Dudect Side-Channel Leakage Gate (|t| < 4.5)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Dudect Welch's t-test Statistical Analysis
        run: cargo bench --bench dudect_bench -- --nocapture

  # Job 3: Valgrind / Memcheck-TIMECOP Dynamic Analysis
  valgrind-timecop:
    name: Valgrind Memcheck & Timing Branch Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Debug Binary with Symbols
        run: cargo build --bin aegis-seed

      - name: Run Valgrind Memcheck Execution
        run: |
          valgrind --error-exitcode=1 \
                   --leak-check=full \
                   --track-origins=yes \
                   ./target/debug/aegis-seed

